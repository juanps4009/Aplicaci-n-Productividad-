name: Widget de Android

# Compila el APK del widget y lo publica en la página de Releases (etiqueta "widget-latest").
on:
  push:
    branches: ["claude/hopeful-brahmagupta-m6bura"]
    paths: ["android/**", ".github/workflows/android-widget.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pendientes-widget-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pendientes-widget.apk
          gh release delete widget-latest --yes --cleanup-tag || true
          gh release create widget-latest pendientes-widget.apk \
            --title "Widget de Pendientes (compilación ${{ github.run_number }})" \
            --notes "APK del widget de Android. Descárgalo en el celular e instálalo (permite instalar apps desconocidas). Guía: android/README.md" \
            --prerelease \
            --target "$GITHUB_SHA"

plugins {
    id 'com.android.application'
}

android {
    namespace 'app.productividad.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'app.productividad.widget'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Llave de depuración fija (pública, sin secretos) para que cada versión nueva se pueda instalar encima de la anterior.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

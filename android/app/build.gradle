plugins {
    id 'com.android.application'
}

// El servidor de la app se lee de ../../config.js (campo "server"), así hay un solo lugar donde cambiarlo.
def defaultServer = ''
def configJs = file('../../config.js')
if (configJs.exists()) {
    def m = (configJs.text =~ /server:\s*"([^"]*)"/)
    if (m.find()) defaultServer = m.group(1).trim().replaceAll('/+$', '')
}

android {
    namespace 'app.productividad.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'app.productividad.widget'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.1'
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${defaultServer}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Llave de depuración fija (pública, sin secretos) para que cada versión nueva se pueda instalar encima de la anterior.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Llamadas con Claude (2.0): avisos de Firebase para que suene con el celular bloqueado, y WebSocket para la voz (Gemini Live)
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

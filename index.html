<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <title>Productividad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 id="page-title" class="text-xl font-bold">Pendientes</h1>
    <button id="open-settings" class="icon-btn" aria-label="Ajustes">⚙</button>
  </header>

  <main class="app-main">
    <!-- PESTAÑA: PENDIENTES -->
    <section id="tab-tasks" class="tab-panel">
      <form id="task-form" class="card p-3 space-y-3">
        <div class="flex gap-2">
          <input id="task-input" type="text" maxlength="200" autocomplete="off"
                 placeholder="Nueva tarea…" aria-label="Nueva tarea" class="field flex-1 min-w-0">
          <button type="submit" class="btn-primary px-5 text-2xl" aria-label="Añadir tarea">+</button>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <div id="new-priority" class="prio-chips" role="radiogroup" aria-label="Prioridad"></div>
          <input id="task-due" type="date" class="field due-field" aria-label="Fecha límite">
        </div>
      </form>

      <div id="filters" class="mt-4 flex gap-2" role="tablist">
        <button data-filter="all" class="filter-btn">Todas</button>
        <button data-filter="pending" class="filter-btn">Pendientes</button>
        <button data-filter="done" class="filter-btn">Completadas</button>
      </div>

      <p id="task-counter" class="muted mt-3 text-sm"></p>
      <div id="task-groups" class="mt-2 space-y-5"></div>
      <p id="task-empty" class="muted hidden py-10 text-center">No hay tareas para mostrar.</p>
    </section>

    <!-- PESTAÑA: RESÚMENES -->
    <section id="tab-books" class="tab-panel hidden">
      <button id="new-book" type="button" class="btn-primary w-full py-3">+ Nuevo resumen de libro</button>
      <div id="book-list" class="mt-4 space-y-4"></div>
      <p id="book-empty" class="muted hidden py-10 text-center">Aún no tienes resúmenes. ¡Crea el primero!</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button data-tab="tasks" class="nav-btn active">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Pendientes</span>
    </button>
    <button data-tab="books" class="nav-btn">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Resúmenes</span>
    </button>
  </nav>

  <!-- AJUSTES -->
  <div id="settings" class="sheet-backdrop hidden">
    <div class="sheet" role="dialog" aria-label="Ajustes">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold">Ajustes</h2>
        <button id="close-settings" class="icon-btn" aria-label="Cerrar">✕</button>
      </div>

      <div class="setting">
        <p class="setting-label">Estilo de prioridad</p>
        <div class="seg" data-setting="priorityStyle">
          <button data-value="dot">● Punto</button>
          <button data-value="border">▌Borde</button>
        </div>
      </div>

      <div class="setting">
        <p class="setting-label">Agrupar tareas por</p>
        <div class="seg" data-setting="groupBy">
          <button data-value="date">Fecha</button>
          <button data-value="priority">Prioridad</button>
        </div>
      </div>

      <div class="setting">
        <p class="setting-label">Recordatorios</p>
        <button id="enable-notif" class="btn-secondary w-full py-3"></button>
        <p class="muted mt-1 text-xs">Avisan de tareas con fecha de hoy o vencidas mientras la app esté abierta o instalada.</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Productividad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="app-header">
    <h1 id="page-title" class="text-xl font-bold">Pendientes</h1>
  </header>

  <main class="app-main">
    <!-- PESTAÑA: PENDIENTES -->
    <section id="tab-tasks" class="tab-panel">
      <form id="task-form" class="flex gap-2">
        <input id="task-input" type="text" maxlength="200" autocomplete="off"
               placeholder="Nueva tarea…" aria-label="Nueva tarea"
               class="flex-1 min-w-0 rounded-xl border border-slate-200 bg-white px-4 py-3 text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <button type="submit" aria-label="Añadir tarea"
                class="rounded-xl bg-indigo-600 px-5 text-2xl font-medium text-white shadow-sm active:bg-indigo-700">+</button>
      </form>

      <div id="filters" class="mt-4 flex gap-2" role="tablist">
        <button data-filter="all" class="filter-btn">Todas</button>
        <button data-filter="pending" class="filter-btn">Pendientes</button>
        <button data-filter="done" class="filter-btn">Completadas</button>
      </div>

      <p id="task-counter" class="mt-3 text-sm text-slate-500"></p>
      <ul id="task-list" class="mt-2 space-y-2"></ul>
      <p id="task-empty" class="hidden py-10 text-center text-slate-400">No hay tareas para mostrar.</p>
    </section>

    <!-- PESTAÑA: RESÚMENES -->
    <section id="tab-books" class="tab-panel hidden">
      <button id="new-book" type="button"
              class="w-full rounded-xl bg-indigo-600 py-3 font-medium text-white shadow-sm active:bg-indigo-700">
        + Nuevo resumen de libro
      </button>
      <div id="book-list" class="mt-4 space-y-4"></div>
      <p id="book-empty" class="hidden py-10 text-center text-slate-400">Aún no tienes resúmenes. ¡Crea el primero!</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button data-tab="tasks" class="nav-btn active">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Pendientes</span>
    </button>
    <button data-tab="books" class="nav-btn">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Resúmenes</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
